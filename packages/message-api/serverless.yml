service: hrk-message-api
configValidationMode: error

frameworkVersion: "4"

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude: ['aws-sdk']
    target: 'node20'
    define: { 'require.resolve': undefined }
    platform: 'node'

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-north-1
  stage: ${opt:stage, 'dev'}
  logRetentionInDays: 30
  environment:
    MAIN_TABLE: ${self:custom.mainTableName}
  httpApi:
    cors: true
    authorizers:
      centralJwtAuthorizer:
        type: request
        functionArn: "arn:aws:lambda:eu-north-1:${aws:accountId}:function:hrk-apigateway-admin-authorizer-${sls:stage}"
        enableSimpleResponses: true
        identitySource:
          - $request.header.Authorization

package:
  individually: true

plugins:
  - serverless-iam-roles-per-function

custom:
  mainTableName: HrkMainTable-${self:provider.stage}
  userPoolId: ${file(./env.${self:provider.stage}.yaml):COGNITO_USER_POOL_ID}

functions:
  - ${file(./yaml/message-functions.yml)}

resources:
  Resources:
    ApiGatewayAuthorizerPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName:
          Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:hrk-apigateway-admin-authorizer-${sls:stage}
        Action: lambda:InvokeFunction
        Principal: apigateway.amazonaws.com
